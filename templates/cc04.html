<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masika Creator | Architect Profile</title>
    
    <!-- Premium Font Engines -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,600;0,800;1,400&family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    
    <!-- GSAP for Entry Micro-Interactions -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        /* --- GLOBAL SYSTEM MATRIX --- */
        :root {
            --c-bg: #f1f4fa;      
            --c-dark: #07090f;    
            --c-red: #fa1e34;     

            /* Typography */
            --font-cine: 'Playfair Display', serif;
            --font-ui: 'Outfit', sans-serif;
            --font-data: 'JetBrains Mono', monospace;
            
            /* Ambience */
            --ease-cinematic: cubic-bezier(0.19, 1, 0.22, 1);
        }

        /* Lock Body - Flexible Height */
        html, body {
            margin: 0; padding: 0; box-sizing: border-box;
            background-color: var(--c-bg);
            color: var(--c-dark);
            font-family: var(--font-ui);
            width: 100%;
            -webkit-font-smoothing: antialiased;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.8) 0%, transparent 80%),
                linear-gradient(to right, rgba(7,9,15,0.015) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(7,9,15,0.015) 1px, transparent 1px);
            background-size: 100% 100%, 60px 60px, 60px 60px;
        }

        ::selection { background: var(--c-red); color: var(--c-bg); }

        /* --- LAYOUT ARCHITECTURE --- */
        .profile-matrix {
            display: grid;
            grid-template-columns: 0.8fr 1.2fr;
            width: 100%; max-width: 1400px; min-height: 100vh;
            margin: 0 auto; padding: 80px 5% 100px;
            align-items: center; gap: 8vw;
            position: relative;
            z-index: 2;
            box-sizing: border-box;
        }

        /* --- GLOBAL BACK BUTTON --- */
        .nav-back {
            position: absolute; top: 30px; left: 5%; z-index: 100;
            display: inline-flex; align-items: center; gap: 10px;
            font-family: var(--font-data); font-size: 0.7rem; font-weight: 700;
            letter-spacing: 0.2em; text-transform: uppercase; color: var(--c-dark);
            text-decoration: none; transition: all 0.4s var(--ease-cinematic);
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 100px;
            border: 1px solid rgba(7, 9, 15, 0.05);
            box-shadow: 0 4px 15px rgba(7, 9, 15, 0.02);
            white-space: nowrap;
        }
        .nav-back svg { width: 16px; height: 16px; transition: transform 0.4s ease; stroke-width: 2; }
        .nav-back:hover { color: var(--c-red); border-color: rgba(250, 30, 52, 0.2); transform: translateY(-1px); }
        .nav-back:hover svg { transform: translateX(-4px); }

        /* --- LEFT SECTOR: VISUAL & SOCIALS --- */
        .visual-sector {
            display: flex; flex-direction: column; align-items: center; gap: 30px;
            flex: 1; min-width: 0;
        }

        /* Advanced Premium Frame */
        .premium-frame {
            position: relative; padding: 20px;
            width: 100%; max-width: 320px;
            aspect-ratio: 3 / 4;
            flex-shrink: 0;
        }

        /* Frame Corner Accents */
        .premium-frame::before, .premium-frame::after {
            content: ''; position: absolute;
            width: 30px; height: 30px;
            border: 1.5px solid var(--c-dark);
            transition: all 0.6s var(--ease-cinematic);
            pointer-events: none; z-index: 2;
        }
        .premium-frame::before { top: 0; left: 0; border-right: none; border-bottom: none; }
        .premium-frame::after { bottom: 0; right: 0; border-left: none; border-top: none; }
        
        /* Frame Scanning Track */
        .frame-track {
            position: absolute; inset: 10px;
            border: 1px solid rgba(7, 9, 15, 0.05);
            z-index: 0; pointer-events: none;
        }
        .frame-track::before {
            content: ''; position: absolute; top: -1px; left: 20%;
            width: 15px; height: 2px; background: var(--c-red);
            animation: scanLineTop 6s linear infinite;
        }

        @keyframes scanLineTop {
            0% { left: 10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { left: 90%; opacity: 0; }
        }

        .img-container {
            width: 100%; height: 100%;
            position: relative; overflow: hidden;
            border-radius: 4px; z-index: 1;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            background: rgba(7, 9, 15, 0.05);
            box-sizing: border-box;
        }
        
        .img-container img {
            width: 100%; height: 100%; object-fit: cover;
            object-position: top center;
            filter: grayscale(100%) contrast(115%);
            transition: all 0.8s var(--ease-cinematic);
            display: block;
        }

        .premium-frame:hover .img-container img { filter: grayscale(0%); transform: scale(1.03); }
        .premium-frame:hover::before { transform: translate(-5px, -5px); border-color: var(--c-red); }
        .premium-frame:hover::after { transform: translate(5px, 5px); border-color: var(--c-red); }

        /* --- RIGHT SECTOR: TYPOGRAPHY & DATA --- */
        .data-sector {
            display: flex; flex-direction: column; justify-content: flex-start;
            flex: 1; min-width: 0;
        }

        /* Creative Corner Wrapper */
        .creative-corner-wrap {
            position: relative; padding: 40px 40px 30px 40px;
        }
        .creative-corner-wrap::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 60px; height: 60px;
            border-top: 2px solid rgba(7, 9, 15, 0.1);
            border-left: 2px solid rgba(7, 9, 15, 0.1);
            pointer-events: none;
        }
        .creative-corner-wrap::after {
            content: ''; position: absolute; top: -3px; left: -3px;
            width: 8px; height: 8px; background: var(--c-red); border-radius: 50%;
        }

        /* 2-Type Font Name Layout */
        .profile-label {
            font-family: var(--font-data); font-size: 0.75rem; font-weight: 700;
            color: rgba(7, 9, 15, 0.5); letter-spacing: 0.2em; text-transform: uppercase;
            margin-bottom: 15px; display: flex; align-items: center; gap: 10px;
            flex-wrap: wrap;
        }
        .profile-label::before { content: ''; width: 30px; height: 1px; background: var(--c-red); }

        .hybrid-name {
            display: flex; flex-direction: column; line-height: 1.05;
            font-size: clamp(2rem, 4vw, 3.5rem); margin: 0 0 20px 0;
            word-break: break-word;
        }
        .hybrid-name .n-ui { font-family: var(--font-ui); font-weight: 700; letter-spacing: -0.02em; color: var(--c-dark); }
        .hybrid-name .n-cine { font-family: var(--font-cine); font-style: italic; font-weight: 400; color: var(--c-red); padding-left: 0; }

        /* Minimalist Description */
        .aesthetic-desc {
            font-family: var(--font-ui); font-size: clamp(0.95rem, 1.1vw, 1.1rem);
            color: rgba(7, 9, 15, 0.5); line-height: 1.6; max-width: 100%;
            margin-bottom: 25px; font-weight: 400; border-left: 2px solid rgba(250,30,52,0.15); padding-left: 20px;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        /* Super Minimalistic "Coming Soon" Lock Box instead of Bullets */
        .sys-lock-box {
            display: inline-flex; align-items: center; gap: 12px;
            padding: 14px 24px; border: 1px solid rgba(7, 9, 15, 0.1);
            border-radius: 100px; font-family: var(--font-data);
            font-size: 0.7rem; font-weight: 700; letter-spacing: 0.25em;
            text-transform: uppercase; color: var(--c-dark);
            background: rgba(7, 9, 15, 0.02); margin-top: 10px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.02);
            width: max-content;
            flex-shrink: 0;
        }
        .sys-pulse {
            width: 8px; height: 8px; background: var(--c-red);
            border-radius: 50%; position: relative;
        }
        .sys-pulse::after {
            content: ''; position: absolute; inset: -4px;
            border-radius: 50%; border: 1px solid var(--c-red);
            animation: pulseRed 2s cubic-bezier(0.19, 1, 0.22, 1) infinite;
        }

        @keyframes pulseRed { 
            0% { transform: scale(0.5); opacity: 1; } 
            100% { transform: scale(2.5); opacity: 0; } 
        }
        
        /* Background decorative elements */
        .hud-bg-text { position: absolute; font-family: var(--font-data); font-size: 12vw; font-weight: 800; color: rgba(7,9,15,0.015); bottom: 5%; right: 5%; pointer-events: none; white-space: nowrap; letter-spacing: -0.05em; z-index: 1; -webkit-user-select: none; user-select: none; opacity: 0.5; }

        /* Page Navigation Controls */
        .book-controls {
            position: fixed;
            bottom: 30px;
            right: 5%;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(7, 9, 15, 0.08);
            padding: 8px 16px;
            border-radius: 100px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }
        .control-btn {
            background: transparent;
            border: 1px solid rgba(7, 9, 15, 0.1);
            color: var(--c-dark);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s var(--ease-cinematic);
            padding: 0;
        }
        .control-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
        }
        .control-btn:hover {
            background: var(--c-red);
            color: var(--c-bg);
            border-color: var(--c-red);
            box-shadow: 0 4px 12px rgba(250, 30, 52, 0.2);
            transform: translateY(-1px);
        }
        .control-btn:active {
            transform: translateY(0);
        }
        .control-btn.disabled {
            opacity: 0.25;
            pointer-events: none;
        }
        .page-num {
            font-family: var(--font-data);
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            font-weight: 700;
            color: rgba(7, 9, 15, 0.6);
            margin-left: 4px;
            user-select: none;
        }

        /* MOBILE RESPONSIVE - Full stack layout */
        @media (max-width: 768px) {
            *, *::before, *::after {
                box-sizing: border-box !important;
            }
            html, body {
                overflow-x: hidden !important;
                overflow-y: auto !important;
                height: auto !important;
                min-height: 100vh !important;
                width: 100% !important;
            }

            /* Stack the two-column grid vertically */
            .profile-matrix {
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                width: 100% !important;
                max-width: 100% !important;
                padding: 60px 20px 80px !important;
                gap: 25px !important;
                height: auto !important;
                min-height: auto !important;
                box-sizing: border-box !important;
                overflow-x: hidden !important;
            }

            /* Back button at top */
            .nav-back {
                top: 20px !important;
                left: 20px !important;
                font-size: 0.65rem !important;
                padding: 6px 12px !important;
            }

            /* Visual sector - center aligned */
            .visual-sector {
                width: 100% !important;
                align-items: center !important;
                display: flex !important;
                flex-direction: column !important;
            }

            /* Image frame - responsive width, portrait ratio */
            .premium-frame {
                width: min(70vw, 240px) !important;
                aspect-ratio: 3 / 4 !important;
                padding: 12px !important;
                box-sizing: border-box !important;
            }

            /* Right/data sector - full width, no clipping */
            .data-sector {
                width: 100% !important;
                max-width: 100% !important;
                box-sizing: border-box !important;
                overflow: visible !important;
            }

            /* Corner decoration - tighten & give symmetrical padding to avoid cutoff */
            .creative-corner-wrap {
                padding: 25px 20px !important;
                width: 100% !important;
                box-sizing: border-box !important;
            }

            /* Name - responsive, no overflow */
            .hybrid-name {
                font-size: clamp(1.6rem, 6vw, 2.4rem) !important;
                margin-bottom: 12px !important;
                word-break: break-word !important;
            }
            .hybrid-name .n-cine {
                padding-left: 0 !important;
            }

            /* Description - full width, no right clip */
            .aesthetic-desc {
                font-size: 0.85rem !important;
                max-width: 100% !important;
                margin-bottom: 18px !important;
                word-break: break-word !important;
                overflow-wrap: break-word !important;
                padding-left: 15px !important;
            }

            /* Lock box */
            .sys-lock-box {
                font-size: 0.6rem !important;
                padding: 10px 18px !important;
            }
            
            .sys-pulse {
                width: 6px !important;
                height: 6px !important;
            }

            /* Profile label */
            .profile-label {
                font-size: 0.6rem !important;
                flex-wrap: wrap !important;
                gap: 8px !important;
            }
            
            .profile-label::before {
                width: 20px !important;
            }

            /* HUD bg text - smaller so it doesn't cause overflow */
            .hud-bg-text {
                font-size: 18vw !important;
                opacity: 0.3 !important;
                right: 0 !important;
                bottom: 2% !important;
            }

            /* Pagination controls hidden on mobile (scroll-based navigation) */
            .book-controls {
                display: none !important;
            }
        }

        /* RESPONSIVE ADJUSTMENTS FOR LAPTOP VIEWS */
        @media (max-width: 1600px) {
            .profile-matrix {
                gap: 5vw;
            }
        }
        
        @media (max-width: 1366px) {
            .profile-matrix {
                padding: 70px 3% 90px;
            }
            .hud-bg-text {
                font-size: 10vw;
            }
        }
    </style>

</head>
<body>

    <!-- Back Navigation -->
    <a href="/team" class="nav-back gsap-elem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Return to Team
    </a>

    <div class="hud-bg-text">04.NARRATIVE</div>

    <div class="profile-matrix">
        
        <!-- LEFT: Visual Profile -->
        <div class="visual-sector">
            
            <div class="premium-frame gsap-elem">
                <div class="frame-track"></div>
                <div class="img-container">
                    <img src="../static/cc04.jpg" alt="Masika Creator">
                </div>
            </div>
            
            <!-- Absolute Minimalism: No Social Media Node -->

        </div>

        <!-- RIGHT: Data & Typography -->
        <div class="data-sector">
            <div class="creative-corner-wrap">
                
                <div class="profile-label gsap-elem">PSYCHOMETRIC LOGIC : 04</div>
                
                <h1 class="hybrid-name gsap-elem">
                    <span class="n-ui">Masika</span>
                    <span class="n-cine">Creator</span>
                </h1>
                
                <p class="aesthetic-desc gsap-elem">
                    Health Guide. Node architecture currently syncing. Full aesthetic overview and narrative metrics will be established shortly.
                </p>

                <!-- Super Minimalistic "Coming Soon" Lock Box instead of Bullets -->
                <div class="sys-lock-box gsap-elem">
                    <div class="sys-pulse"></div>
                    <span>Profile Coming Soon</span>
                </div>

            </div>
        </div>

    </div>

    <!-- Page Navigation Controls -->
    <div class="book-controls">
        <button class="control-btn prev-btn" onclick="scrollToPrevSlide()" aria-label="Previous Page">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="control-btn next-btn" onclick="scrollToNextSlide()" aria-label="Next Page">
            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="page-num">PG. <span id="current-page-num">04</span> / 04</span>
    </div>

    <!-- Initialization Scripts -->
    <script>
        // Cinematic Load Sequence
        document.addEventListener("DOMContentLoaded", (event) => {
            gsap.fromTo(".gsap-elem", 
                { 
                    y: 40, 
                    opacity: 0,
                    filter: "blur(8px)"
                },
                { 
                    y: 0, 
                    opacity: 1, 
                    filter: "blur(0px)",
                    duration: 1.2, 
                    stagger: 0.15, 
                    ease: "power4.out",
                    delay: 0.2
                }
            );
            
            // Initialize pagination
            initPagination();
        });

        // Pagination State
        let currentPage = 4;
        const totalPages = 4;
        
        // Page URLs (matching cc01-cc04)
        const pageUrls = ['cc01.html', 'cc02.html', 'cc03.html', 'cc04.html'];

        function updatePaginationControls() {
            const prevBtn = document.querySelector('.prev-btn');
            const nextBtn = document.querySelector('.next-btn');
            const pageNumElem = document.getElementById('current-page-num');
            
            if (pageNumElem) {
                pageNumElem.textContent = String(currentPage).padStart(2, '0');
            }
            
            if (prevBtn) {
                if (currentPage === 1) {
                    prevBtn.classList.add('disabled');
                    prevBtn.setAttribute('disabled', 'true');
                } else {
                    prevBtn.classList.remove('disabled');
                    prevBtn.removeAttribute('disabled');
                }
            }
            
            if (nextBtn) {
                if (currentPage === totalPages) {
                    nextBtn.classList.add('disabled');
                    nextBtn.setAttribute('disabled', 'true');
                } else {
                    nextBtn.classList.remove('disabled');
                    nextBtn.removeAttribute('disabled');
                }
            }
        }

        function scrollToNextSlide() {
            if (currentPage < totalPages) {
                currentPage++;
                updatePaginationControls();
                window.location.href = pageUrls[currentPage - 1];
            }
        }

        function scrollToPrevSlide() {
            if (currentPage > 1) {
                currentPage--;
                updatePaginationControls();
                window.location.href = pageUrls[currentPage - 1];
            }
        }

        function initPagination() {
            const urlPath = window.location.pathname;
            const filename = urlPath.split('/').pop() || 'index.html';
            
            const pageMap = {
                'cc01.html': 1,
                'cc02.html': 2,
                'cc03.html': 3,
                'cc04.html': 4
            };
            
            currentPage = pageMap[filename] || 1;
            updatePaginationControls();
        }

        // Expose functions globally
        window.scrollToNextSlide = scrollToNextSlide;
        window.scrollToPrevSlide = scrollToPrevSlide;
    </script>

    </body>
</html>
